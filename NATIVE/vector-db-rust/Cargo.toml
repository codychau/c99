[package]
name = "vector-db-rust"
version = "0.1.0"
edition = "2021"
description = "内置向量数据库（Rust）—— 支持增删改查与多种距离算法的 cdylib"

[lib]
name = "BuiltInVectorDb"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"