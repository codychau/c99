[package]
name = "local-kb-skill"
version = "0.1.0"
edition = "2021"
description = "Local knowledge-base retrieval HTTP client for the 9527 /api/kb/query endpoint"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

[profile.release]
strip = true
lto = true
